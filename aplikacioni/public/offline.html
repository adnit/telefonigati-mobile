<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TelefoniGati · Pa internet</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #000; --text2: #6c6c70; --accent: #0062cc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #fff; --text2: #98989f; --accent: #0a6fe0; } }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  main { max-width: 400px; text-align: center; background: var(--card); border-radius: 16px; padding: 28px 22px; }
  h1 { font-size: 1.375rem; margin: 0 0 8px; }
  p { color: var(--text2); margin: 0 0 20px; }
  button { width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; font-size: 1.0625rem; }
</style>
</head>
<body>
<main>
  <h1>Pa internet</h1>
  <p>Kjo faqe nuk është ruajtur ende në këtë telefon. Hape linkun e riparimit një herë me internet; pastaj statusi i fundit lexohet edhe pa lidhje.</p>
  <button onclick="location.reload()">Provo përsëri</button>
</main>
</body>
</html>
